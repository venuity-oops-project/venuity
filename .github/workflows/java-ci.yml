name: Java CI

on:
  push:
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check static JavaScript syntax
        run: |
          for file in java/venuity-server/src/main/resources/static/js/*.js \
                      java/venuity-server/src/main/resources/static/js/pages/*.js; do
            node --input-type=module --check < "$file"
          done

      - name: Make wrapper executable
        working-directory: java
        run: chmod +x mvnw

      - name: Build and test
        working-directory: java
        run: ./mvnw -B -ntp verify

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: venuity
          path: java/venuity-server/target/venuity.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: java/**/target/surefire-reports/**
          if-no-files-found: ignore
