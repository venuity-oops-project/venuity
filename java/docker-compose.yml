services:
  mysql:
    image: mysql:8.4
    container_name: venuity-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: venuity
      MYSQL_USER: venuity
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports: ["3306:3306"]
    volumes: ["venuity-mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venuity-server
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: venuity
      DB_USER: venuity
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      JWT_SECRET: ${JWT_SECRET:-dev-only-venuity-secret-change-me-32-bytes}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports: ["8080:8080"]

volumes:
  venuity-mysql-data:
